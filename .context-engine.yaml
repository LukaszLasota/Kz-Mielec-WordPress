# Code Context Engine — reguły indeksowania dla projektu kzmielec.
# Docroot = root repo (pełny WordPress, NIE Bedrock). Rdzeń WP = ./wp-admin, ./wp-includes.
#
# KLUCZOWE: indexer.ignore jest NAME-ONLY (CCE 0.4.25) — dopasowuje NAZWĘ każdego
# segmentu ścieżki (scalone z DEFAULT_IGNORE: vendor, node_modules, .git, dist,
# build, logs). Wpisuj GOŁE NAZWY KATALOGÓW. Poprzednie wpisy ze slashem/ścieżką
# ("wp-admin/", "wp-content/plugins/autoptimize/", "*/assets/") były cichymi no-opami.
# Ref: ~/projects/dev-tooling/code-context-engine.md §2, §6.1.
#
# Brak kolizji `wp` (docroot = root, brak wrappera). Nasz kod indeksowany przez
# `cce index --path` (git-hooki, już utwardzone): themes/kzmielec,
# plugins/custom-block-package, plugins/custom-posts. Stary html5blank-stable
# celowo NIE wykluczony (referencja migracji). `cache` chroni watcher przed
# reindeks-sztormem (Blade compile → zawis WSL, §6.9).
indexer:
  ignore:
    # --- rdzeń WordPressa ---
    - wp-admin
    - wp-includes
    # --- third-party pluginy (po NAZWIE; nasze custom-block-package / custom-posts
    #     / comparison-of-religions ZOSTAJĄ w głównym indeksie, bez zależności od hooków) ---
    - litespeed-cache
    - instagram-feed
    - wordpress-seo
    - twentytwentyfive   # domyślny motyw WP (nie nasz)
    # --- media / cache / zbudowany output (nie źródło) ---
    - uploads
    - cache
    - upgrade
    - languages
    - assets             # skompilowane JS/CSS (źródło jest w webpack/src, src/)
    - build              # zbudowane bloki (źródło w src/)
    # --- infra / sekrety / snapshot ---
    - .ddev
    - stara_strona       # stara statyczna strona (snapshot)
    - wp-config.php      # dane dostępowe do bazy — nigdy nie indeksować
    - wp-config-ddev.php
