# Code Context Engine -- indexing rules for the kzmielec project.
# Docroot is the repository root (a full WordPress install, NOT Bedrock), so core
# lives at ./wp-admin and ./wp-includes.
#
# THE THING TO KNOW: indexer.ignore is NAME-ONLY (CCE 0.4.25). It matches the
# NAME of any path segment, merged with DEFAULT_IGNORE (vendor, node_modules,
# .git, dist, build, logs). Write BARE DIRECTORY NAMES. Earlier entries written
# as paths or with a trailing slash ("wp-admin/", "wp-content/plugins/autoptimize/",
# "*/assets/") were silent no-ops -- they excluded nothing and reported nothing.
#
# No `wp` collision to worry about, because the docroot is the root and there is
# no wrapper directory. Our own code is indexed by `cce index --path` from the git
# hooks: themes/kzmielec, plugins/custom-block-package, plugins/custom-posts. The
# old html5blank-stable theme used to be indexed here as the migration reference;
# it was removed once the migration was verified against the production database.
# `cache` is listed to keep the watcher out of a reindex storm (a Blade compile
# pass hangs WSL).
indexer:
  ignore:
    # --- WordPress core ---
    - wp-admin
    - wp-includes
    # --- third-party plugins (BY NAME; our own custom-block-package / custom-posts
    #     / comparison-of-religions STAY in the main index, with no dependency on hooks) ---
    - litespeed-cache
    - instagram-feed
    - wordpress-seo
    - twentytwentyfive   # the default WP theme, not ours
    # --- media / cache / build output (not source) ---
    - uploads
    - cache
    - upgrade
    - languages
    - assets             # compiled JS/CSS (the source is under src/, via webpack)
    - build              # compiled blocks (the source is under src/)
    # --- infrastructure / credentials / snapshots ---
    - .ddev
    - stara_strona       # the old static site, kept as a snapshot
    - wp-config.php      # database credentials -- never index
    - wp-config-ddev.php
